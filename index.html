<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnSteD</title>
    <meta name="description"
        content="Hi, I’m UnSteD — a beginner developer. This is my personal portfolio blog with projects, notes, and experiments.">
    <meta name="theme-color" content="#0b0b0b">

    <link rel="stylesheet" href="css/styles.css">

    <link rel="icon" type="image/x-icon" sizes="32x32" href="favicon.ico">
    <link rel="icon" type="image/svg+xml" href="images/favicons/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicons/favicon-180.png">
    <link rel="manifest" href="favicon.webmanifest">
</head>

<body>
    <div class="wrapper">
        <header class="header">
            <!-- Header Inner -->
            <div class="header__inner">

                <div class="container header__container">
                    <!-- Brand -->
                    <a class="header__brand" href="index.html" aria-label="UnSteD — home">
                        <img class="header__brand-logo" src="images/logo/logo.svg" alt="" width="32" height="32"
                            aria-hidden="true">
                        <span class="header__brand-name">UnSainTeD</span>
                    </a>

                    <!-- Navigation -->
                    <nav class="header__nav" aria-label="Main navigation">
                        <ul class="header__nav-list">
                            <li class="header__nav-item">
                                <a class="link header__nav-link" href="#home" aria-current="page">Home</a>
                            </li>
                            <li class="header__nav-item">
                                <a class="link header__nav-link" href="#projects">Projects</a>
                            </li>
                            <li class="header__nav-item">
                                <a class="link header__nav-link" href="#blog">Blog</a>
                            </li>
                            <li class="header__nav-item">
                                <a class="link header__nav-link" href="#about">About</a>
                            </li>
                        </ul>
                    </nav>

                    <!-- External links -->
                    <div class="header__actions" aria-label="External links and theme">
                        <a class="link header__external-link" href="https://github.com/UnSainTeD-Dev" target="_blank"
                            rel="noopener noreferrer" aria-label="Open GitHub profile">
                            GitHub
                        </a>

                        <button class="btn header__theme-toggle" type="button" id="theme-toggle"
                            aria-label="Switch color theme" aria-pressed="false">
                            Theme
                        </button>
                    </div>
                </div>

            </div>
        </header>

        <main class="main">
            <!-- Main Inner -->
            <div class="main__inner">

                <div class="container">
                    <!-- BLOCK -->
                </div>

            </div>

        </main>

        <footer class="footer">
            <!-- Footer Inner -->
            <div class="footer__inner">

                <div class="container">
                    <!-- BLOCK -->
                </div>

            </div>

        </footer>

    </div>

    <script src="js/main.js" defer></script>

</body>

</html>
